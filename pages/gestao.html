<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão | ATXcyclingstore</title>
    <link rel="icon" type="image/png" href="../favicon_black.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
        }

        /* LOGIN */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 36px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .login-card h1 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .login-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .login-card input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px 16px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            margin-bottom: 14px;
        }

        .login-card input:focus {
            outline: none;
            border-color: #0077cc;
        }

        .login-card button {
            width: 100%;
            background: #0077cc;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            cursor: pointer;
            font-size: 15px;
        }

        .login-card button:hover {
            background: #005fa3;
        }

        .login-error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 10px;
        }

        /* DASHBOARD */
        .dashboard {
            display: none;
        }

        .dashboard.visible {
            display: block;
        }

        .dash-header {
            background: #000;
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .dash-header h1 {
            font-size: 18px;
        }

        .dash-header button {
            background: none;
            border: 1px solid #333;
            color: #aaa;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
        }

        .dash-body {
            padding: 28px;
            max-width: 1100px;
            margin: auto;
        }

        /* filtros */
        .filtros {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filtro-btn {
            padding: 7px 16px;
            border-radius: 20px;
            border: 1px solid #333;
            background: none;
            color: #888;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            transition: 0.2s;
        }

        .filtro-btn:hover {
            border-color: #0077cc;
            color: #0077cc;
        }

        .filtro-btn.active {
            background: #0077cc;
            border-color: #0077cc;
            color: white;
        }

        /* tabela */
        .bookings-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .booking-row {
            background: #111;
            border: 1px solid #1e1e1e;
            border-radius: 10px;
            padding: 18px 22px;
            display: grid;
            grid-template-columns: 130px 1fr 120px 200px;
            gap: 16px;
            align-items: center;
            transition: border-color 0.2s;
        }

        .booking-row:hover {
            border-color: #333;
        }

        .booking-pedido {
            font-size: 13px;
            color: #0077cc;
            font-weight: 600;
        }

        .booking-nome {
            font-size: 15px;
            font-weight: 500;
        }

        .booking-email {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        .booking-data {
            font-size: 13px;
            color: #888;
        }

        /* select de estado */
        .estado-select {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 7px 10px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
        }

        .estado-select:focus {
            outline: none;
            border-color: #0077cc;
        }

        .save-btn {
            margin-top: 8px;
            width: 100%;
            background: #0a2a0a;
            color: #30d060;
            border: 1px solid #1a5a1a;
            border-radius: 6px;
            padding: 6px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            transition: 0.2s;
            display: none;
        }

        .save-btn.visible {
            display: block;
        }

        .save-btn:hover {
            background: #1a4a1a;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #555;
        }

        @media (max-width: 700px) {
            .booking-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
    <div class="login-card">
        <h1>ATXcyclingstore</h1>
        <p>Área de gestão interna</p>
        <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
        <button onclick="login()">Entrar</button>
        <p class="login-error" id="loginError" style="display:none">Password incorreta.</p>
    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

    <div class="dash-header">
        <h1>Gestão de Marcações</h1>
        <button onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</button>
    </div>

    <div class="dash-body">

        <div class="filtros" id="filtros">
            <button class="filtro-btn active" data-estado="todos" onclick="filtrar(this)">Todos</button>
            <button class="filtro-btn" data-estado="recebida" onclick="filtrar(this)">Recebida</button>
            <button class="filtro-btn" data-estado="diagnostico" onclick="filtrar(this)">Em Diagnóstico</button>
            <button class="filtro-btn" data-estado="reparacao" onclick="filtrar(this)">Em Reparação</button>
            <button class="filtro-btn" data-estado="pronta" onclick="filtrar(this)">Pronta</button>
            <button class="filtro-btn" data-estado="entregue" onclick="filtrar(this)">Entregue</button>
        </div>

        <div class="bookings-grid" id="bookingsGrid"></div>

    </div>
</div>

<script>
    const API_URL = "https://atxcyclingstore.onrender.com";
    const GESTAO_TOKEN = "atx-gestao-2025";  // deve ser igual ao views.py

    const ESTADOS = [
        {key: 'recebida', label: 'Recebida'},
        {key: 'diagnostico', label: 'Em Diagnóstico'},
        {key: 'reparacao', label: 'Em Reparação'},
        {key: 'pronta', label: 'Pronta'},
        {key: 'entregue', label: 'Entregue'},
    ];

    let allBookings = [];
    let filtroAtivo = 'todos';

    // ── Auth simples (client-side) ────────────────────────────────────────
    // A verificação real é feita pelo backend (X-Gestao-Token)
    const LOCAL_PASS = "atx2025";   // password de acesso à página

    function login() {
        const pass = document.getElementById('passwordInput').value;
        if (pass === LOCAL_PASS) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').classList.add('visible');
            carregar();
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    function logout() {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('dashboard').classList.remove('visible');
        document.getElementById('passwordInput').value = '';
    }

    document.getElementById('passwordInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') login();
    });

    // ── Carregar marcações ────────────────────────────────────────────────
    async function carregar() {
        try {
            const res = await fetch(`${API_URL}/api/gestao/bookings/`, {
                headers: {"X-Gestao-Token": GESTAO_TOKEN}
            });
            allBookings = await res.json();
            renderBookings();
        } catch (e) {
            console.error('Erro ao carregar:', e);
        }
    }

    // ── Filtrar ───────────────────────────────────────────────────────────
    function filtrar(btn) {
        document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filtroAtivo = btn.dataset.estado;
        renderBookings();
    }

    // ── Render ────────────────────────────────────────────────────────────
    function renderBookings() {
        const grid = document.getElementById('bookingsGrid');
        grid.innerHTML = '';

        const lista = filtroAtivo === 'todos'
            ? allBookings
            : allBookings.filter(b => b.estado === filtroAtivo);

        if (lista.length === 0) {
            grid.innerHTML = '<div class="empty-state"><p>Sem marcações neste estado.</p></div>';
            return;
        }

        lista.forEach(b => {
            const options = ESTADOS.map(e =>
                `<option value="${e.key}" ${e.key === b.estado ? 'selected' : ''}>${e.label}</option>`
            ).join('');

            const data = new Date(b.data).toLocaleDateString('pt-PT', {
                day: '2-digit',
                month: 'short',
                year: 'numeric'
            });

            grid.innerHTML += `
        <div class="booking-row" id="row-${b.id}">
          <div>
            <div class="booking-pedido">${b.numero_pedido}</div>
            <div style="font-size:12px;color:#555;margin-top:4px">${data}</div>
          </div>
          <div>
            <div class="booking-nome">${b.nome}</div>
            <div class="booking-email">${b.email}</div>
          </div>
          <div style="font-size:13px;color:#777">${b.estado_label}</div>
          <div>
            <select class="estado-select" id="select-${b.id}" onchange="mostrarGuardar(${b.id})">
              ${options}
            </select>
            <button class="save-btn" id="save-${b.id}" onclick="guardarEstado(${b.id})">
              Guardar alteração
            </button>
          </div>
        </div>`;
        });
    }

    function mostrarGuardar(id) {
        document.getElementById(`save-${id}`).classList.add('visible');
    }

    async function guardarEstado(id) {
        const novoEstado = document.getElementById(`select-${id}`).value;
        const btn = document.getElementById(`save-${id}`);

        btn.textContent = 'A guardar...';

        try {
            const res = await fetch(`${API_URL}/api/gestao/bookings/${id}/estado/`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Gestao-Token': GESTAO_TOKEN,
                },
                body: JSON.stringify({estado: novoEstado}),
            });

            if (res.ok) {
                // atualizar localmente
                const idx = allBookings.findIndex(b => b.id === id);
                if (idx !== -1) {
                    allBookings[idx].estado = novoEstado;
                    allBookings[idx].estado_label = ESTADOS.find(e => e.key === novoEstado)?.label || novoEstado;
                }
                btn.textContent = '✓ Guardado';
                btn.style.color = '#30d060';
                setTimeout(() => {
                    btn.classList.remove('visible');
                    btn.textContent = 'Guardar alteração';
                    btn.style.color = '';
                }, 2000);
            } else {
                btn.textContent = 'Erro — tenta novamente';
            }
        } catch {
            btn.textContent = 'Erro de ligação';
        }
    }
</script>

</body>
</html>
