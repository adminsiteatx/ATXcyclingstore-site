<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão | ATXcyclingstore</title>
    <link rel="icon" type="image/png" href="../favicon_black.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
        }

        /* LOGIN */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 36px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .login-card h1 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .login-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .login-card input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px 16px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            margin-bottom: 14px;
        }

        .login-card input:focus {
            outline: none;
            border-color: #0077cc;
        }

        .login-card button {
            width: 100%;
            background: #0077cc;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            cursor: pointer;
            font-size: 15px;
        }

        .login-card button:hover {
            background: #005fa3;
        }

        .login-error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 10px;
        }

        /* DASHBOARD */
        .dashboard {
            display: none;
        }

        .dashboard.visible {
            display: block;
        }

        .dash-header {
            background: #000;
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .dash-header h1 {
            font-size: 18px;
        }

        .dash-header button {
            background: none;
            border: 1px solid #333;
            color: #aaa;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
        }

        .dash-body {
            padding: 28px;
            max-width: 1100px;
            margin: auto;
        }

        /* abas */
        .abas {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            border-bottom: 1px solid #1e1e1e;
            padding-bottom: 0;
        }

        .aba-btn {
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: #666;
            padding: 10px 18px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: -1px;
            transition: color 0.2s, border-color 0.2s;
        }

        .aba-btn:hover { color: #aaa; }

        .aba-btn.active {
            color: white;
            border-bottom-color: #0077cc;
        }

        .aba-content { display: none; }
        .aba-content.active { display: block; }

        /* filtros */
        .filtros {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filtro-btn {
            padding: 7px 16px;
            border-radius: 20px;
            border: 1px solid #333;
            background: none;
            color: #888;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            transition: 0.2s;
        }

        .filtro-btn:hover {
            border-color: #0077cc;
            color: #0077cc;
        }

        .filtro-btn.active {
            background: #0077cc;
            border-color: #0077cc;
            color: white;
        }

        /* tabela */
        .bookings-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .booking-row {
            background: #111;
            border: 1px solid #1e1e1e;
            border-radius: 10px;
            padding: 18px 22px;
            display: grid;
            grid-template-columns: 130px 1fr 120px 200px;
            gap: 16px;
            align-items: center;
            transition: border-color 0.2s;
        }

        .booking-row:hover {
            border-color: #333;
        }

        .booking-pedido {
            font-size: 13px;
            color: #0077cc;
            font-weight: 600;
        }

        .booking-nome {
            font-size: 15px;
            font-weight: 500;
        }

        .booking-email {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        .booking-data {
            font-size: 13px;
            color: #888;
        }

        /* select de estado */
        .estado-select {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 7px 10px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
        }

        .estado-select:focus {
            outline: none;
            border-color: #0077cc;
        }

        .save-btn {
            margin-top: 8px;
            width: 100%;
            background: #0a2a0a;
            color: #30d060;
            border: 1px solid #1a5a1a;
            border-radius: 6px;
            padding: 6px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            transition: 0.2s;
            display: none;
        }

        .save-btn.visible {
            display: block;
        }

        .save-btn:hover {
            background: #1a4a1a;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #555;
        }

        .expand-btn {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 18px;
            padding: 0 6px;
            transition: color 0.2s, transform 0.2s;
            line-height: 1;
        }

        .expand-btn:hover { color: #aaa; }
        .expand-btn.open { transform: rotate(90deg); color: #0077cc; }

        .booking-detail {
            display: none;
            grid-column: 1 / -1;
            background: #0d0d0d;
            border-top: 1px solid #1e1e1e;
            border-radius: 0 0 10px 10px;
            padding: 16px 22px;
            margin: 0 -22px -18px;
            gap: 12px;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }

        .booking-detail.open { display: grid; }

        .detail-item { display: flex; flex-direction: column; gap: 4px; }
        .detail-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-value { font-size: 14px; color: #ccc; }

        .diag-btn {
            margin-top: 12px;
            grid-column: 1 / -1;
            background: #001a33;
            color: #4da6ff;
            border: 1px solid #004080;
            border-radius: 6px;
            padding: 8px 14px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            width: fit-content;
        }

        .diag-btn:hover { background: #002a4d; }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: #111;
            border: 1px solid #222;
            border-radius: 14px;
            padding: 28px;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 {
            font-size: 17px;
            margin-bottom: 4px;
        }

        .modal-sub {
            font-size: 13px;
            color: #666;
            margin-bottom: 24px;
        }

        .modal-field {
            margin-bottom: 16px;
        }

        .modal-field label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .modal-field input,
        .modal-field textarea {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px 14px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            resize: vertical;
        }

        .modal-field input:focus,
        .modal-field textarea:focus {
            outline: none;
            border-color: #0077cc;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .modal-gmail-btn {
            flex: 1;
            background: #0077cc;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 11px 16px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        .modal-gmail-btn:hover { background: #005fa3; }

        .modal-cancel-btn {
            background: none;
            border: 1px solid #333;
            color: #888;
            border-radius: 6px;
            padding: 11px 16px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: 0.2s;
        }

        .modal-cancel-btn:hover { border-color: #555; color: #aaa; }

        /* GESTÃO DE VAGAS */
        .vagas-section {
            margin-bottom: 32px;
        }

        .vagas-section h2 {
            font-size: 15px;
            color: #aaa;
            margin-bottom: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .vagas-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .vaga-row {
            background: #111;
            border: 1px solid #1e1e1e;
            border-radius: 8px;
            padding: 14px 18px;
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 12px;
            align-items: center;
        }

        .vaga-semana {
            font-size: 14px;
            font-weight: 500;
        }

        .vaga-badge {
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .vaga-badge.ok    { background: #002a10; color: #30d060; border: 1px solid #006030; }
        .vaga-badge.aviso { background: #2a1e00; color: #f0c040; border: 1px solid #6e5000; }
        .vaga-badge.cheio { background: #2a0a0a; color: #ff6b6b; border: 1px solid #5a1a1a; }

        .vaga-input {
            width: 70px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 6px 10px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            text-align: center;
        }

        .vaga-input:focus { outline: none; border-color: #0077cc; }

        .vaga-save-btn {
            background: #0a2a0a;
            color: #30d060;
            border: 1px solid #1a5a1a;
            border-radius: 6px;
            padding: 6px 14px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            transition: 0.2s;
            white-space: nowrap;
        }

        .vaga-save-btn:hover { background: #1a4a1a; }

        @media (max-width: 600px) {
            .vaga-row {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto;
            }
            .vaga-badge { grid-column: 2; justify-self: end; }
            .vaga-input { width: 60px; }
        }

        @media (max-width: 700px) {
            .dash-header {
                padding: 12px 16px;
                flex-wrap: wrap;
                gap: 10px;
            }

            .dash-header h1 {
                font-size: 15px;
            }

            .dash-header button {
                padding: 5px 10px;
                font-size: 12px;
            }

            .dash-body {
                padding: 16px;
            }

            .filtros {
                gap: 6px;
            }

            .filtro-btn {
                padding: 5px 12px;
                font-size: 12px;
            }

            .booking-row {
                grid-template-columns: 1fr auto !important;
                grid-template-rows: auto auto auto;
            }

            .booking-row > div:nth-child(1) { grid-column: 1; }
            .booking-row > div:nth-child(2) { grid-column: 1; }
            .booking-row > div:nth-child(3) { grid-column: 1; font-size: 12px; }
            .booking-row > div:nth-child(4) { grid-column: 1 / -1; }
            .booking-row > div:nth-child(5) {
                grid-column: 2;
                grid-row: 1;
                align-self: start;
            }

            .booking-detail {
                grid-template-columns: 1fr;
                margin: 0 -16px -16px;
                padding: 12px 16px;
            }
        }
    </style>
</head>

<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
    <div class="login-card">
        <h1>ATXcyclingstore</h1>
        <p>Área de gestão interna</p>
        <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
        <button onclick="login()">Entrar</button>
        <p class="login-error" id="loginError" style="display:none">Password incorreta.</p>
    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

    <div class="dash-header">
        <h1>Gestão de Marcações</h1>
        <div style="display:flex;gap:10px;align-items:center">
            <button onclick="sincronizar()" id="syncBtn" title="Sincronizar com Google Calendar">
                <i class="bi bi-arrow-repeat"></i> Sync Calendar
            </button>
            <button onclick="carregar()" title="Recarregar lista">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
            <button onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</button>
        </div>
    </div>

    <div class="dash-body">

        <div class="abas">
            <button class="aba-btn active" onclick="mudarAba('marcacoes', this)">Marcações</button>
            <button class="aba-btn" onclick="mudarAba('vagas', this)">Gestão de Vagas</button>
            <button class="aba-btn" onclick="mudarAba('comunicacoes', this)">Comunicações</button>
        </div>

        <div class="aba-content active" id="aba-marcacoes">
            <div class="filtros" id="filtros">
                <button class="filtro-btn active" data-estado="todos" onclick="filtrar(this)">Todos</button>
                <button class="filtro-btn" data-estado="marcada" onclick="filtrar(this)">Marcação Efetuada</button>
                <button class="filtro-btn" data-estado="recebida" onclick="filtrar(this)">Recebida</button>
                <button class="filtro-btn" data-estado="diagnostico" onclick="filtrar(this)">Em Diagnóstico</button>
                <button class="filtro-btn" data-estado="reparacao" onclick="filtrar(this)">Em Reparação</button>
                <button class="filtro-btn" data-estado="pronta" onclick="filtrar(this)">Pronta</button>
                <button class="filtro-btn" data-estado="entregue" onclick="filtrar(this)">Entregue</button>
            </div>
            <div class="bookings-grid" id="bookingsGrid"></div>
        </div>

        <div class="aba-content" id="aba-vagas">
            <div class="vagas-grid" id="vagasGrid"></div>
        </div>

        <div class="aba-content" id="aba-comunicacoes">
            <div style="max-width:560px">
                <p style="color:#888;font-size:14px;margin-bottom:20px">
                    Envia uma mensagem SMS a todos os clientes registados que aceitaram receber comunicações.
                </p>
                <div style="margin-bottom:14px">
                    <label style="display:block;font-size:13px;color:#aaa;margin-bottom:6px">Mensagem</label>
                    <textarea id="smsMensagem" rows="5" placeholder="Ex: A ATXcyclingstore estará encerrada de 1 a 15 de agosto. Boas férias!"
                        style="width:100%;background:#0a0a0a;border:1px solid #333;border-radius:8px;padding:12px 14px;color:white;font-family:'Poppins',sans-serif;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>
                    <p id="smsContador" style="font-size:12px;color:#666;margin-top:4px;text-align:right">0 caracteres</p>
                </div>
                <button onclick="enviarSms()" style="background:#0077cc;color:white;border:none;border-radius:8px;padding:12px 24px;font-family:'Poppins',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:background 0.2s;"
                    onmouseover="this.style.background='#005fa3'" onmouseout="this.style.background='#0077cc'">
                    Enviar SMS a todos
                </button>
                <p id="smsResultado" style="margin-top:14px;font-size:14px;display:none"></p>
            </div>
        </div>

    </div>
</div>

<!-- MODAL DIAGNÓSTICO -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2><i class="bi bi-clipboard2-pulse"></i> Enviar Diagnóstico</h2>
        <p class="modal-sub" id="modalSub"></p>

        <div class="modal-field">
            <label>Notas do diagnóstico / peças estimadas</label>
            <textarea id="modalNotas" rows="5" placeholder="Ex: Corrente desgastada, pastilhas de travão a substituir, ajuste de mudanças..."></textarea>
        </div>
        <div class="modal-field">
            <label>Estimativa de preço (€)</label>
            <input type="number" id="modalPreco" placeholder="Ex: 45" min="0">
        </div>
        <div class="modal-field">
            <label>Prazo de entrega estimado</label>
            <input type="text" id="modalPrazo" placeholder="Ex: 3-5 dias úteis">
        </div>

        <div class="modal-actions">
            <button class="modal-gmail-btn" onclick="abrirGmail()">
                <i class="bi bi-envelope"></i> Abrir no Gmail
            </button>
            <button class="modal-cancel-btn" onclick="fecharModal()">Cancelar</button>
        </div>
    </div>
</div>

<script>
    const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? 'http://localhost:8000'
        : 'https://atxcyclingstore.onrender.com';
    const GESTAO_TOKEN = "atx-gestao-2025";  // deve ser igual ao views.py

    const ESTADOS = [
        {key: 'marcada', label: 'Marcação Efetuada'},
        {key: 'recebida', label: 'Recebida'},
        {key: 'diagnostico', label: 'Em Diagnóstico'},
        {key: 'reparacao', label: 'Em Reparação'},
        {key: 'pronta', label: 'Pronta'},
        {key: 'entregue', label: 'Entregue'},
    ];

    let allBookings = [];
    let filtroAtivo = 'todos';

    // ── Auth simples (client-side) ────────────────────────────────────────
    // A verificação real é feita pelo backend (X-Gestao-Token)
    const LOCAL_PASS = "atx2025";   // password de acesso à página

    function login() {
        const pass = document.getElementById('passwordInput').value;
        if (pass === LOCAL_PASS) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').classList.add('visible');
            sincronizarESilencioso().then(() => { carregar(); carregarVagas(); });
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    function logout() {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('dashboard').classList.remove('visible');
        document.getElementById('passwordInput').value = '';
    }

    document.getElementById('passwordInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') login();
    });

    // ── Abas ─────────────────────────────────────────────────────────────
    function mudarAba(id, btn) {
        document.querySelectorAll('.aba-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.aba-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`aba-${id}`).classList.add('active');
        if (id === 'vagas') carregarVagas();
    }

    // ── Gestão de Vagas ───────────────────────────────────────────────────
    const MESES_PT = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

    function segundaFeira(offset = 0) {
        const hoje = new Date();
        const d = new Date(hoje);
        d.setDate(hoje.getDate() - hoje.getDay() + 1 + offset * 7);
        return d;
    }

    function isoDate(d) {
        return d.toISOString().split('T')[0];
    }

    function labelSemana(segunda) {
        const sexta = new Date(segunda);
        sexta.setDate(segunda.getDate() + 4);
        const sabado = new Date(segunda);
        sabado.setDate(segunda.getDate() + 5);
        return `${segunda.getDate()} ${MESES_PT[segunda.getMonth()]} – ${sabado.getDate()} ${MESES_PT[sabado.getMonth()]}`;
    }

    async function carregarVagas() {
        const grid = document.getElementById('vagasGrid');
        grid.innerHTML = '';

        for (let i = 0; i < 11; i++) {
            const segunda = segundaFeira(i);
            const semanaStr = isoDate(segunda);

            try {
                const res = await fetch(`${API_URL}/api/gestao/capacidade/?semana=${semanaStr}`, {
                    headers: {"X-Gestao-Token": GESTAO_TOKEN}
                });
                const d = await res.json();
                const pct = d.vagas_total > 0 ? d.vagas_usadas / d.vagas_total : 1;
                const badgeClass = pct >= 1 ? 'cheio' : pct >= 0.8 ? 'aviso' : 'ok';
                const badgeText = `${d.vagas_usadas} / ${d.vagas_total} vagas`;

                grid.innerHTML += `
                <div class="vaga-row">
                    <div class="vaga-semana">${labelSemana(segunda)}</div>
                    <span class="vaga-badge ${badgeClass}">${badgeText}</span>
                    <input class="vaga-input" type="number" min="1" max="99"
                        id="vaga-input-${semanaStr}" value="${d.vagas_total}">
                    <button class="vaga-save-btn" onclick="guardarVagas('${semanaStr}')">Guardar</button>
                </div>`;
            } catch {
                grid.innerHTML += `<div class="vaga-row"><div class="vaga-semana">${labelSemana(segunda)}</div><span style="color:#555;font-size:13px">Erro ao carregar</span></div>`;
            }
        }
    }

    async function guardarVagas(semanaStr) {
        const input = document.getElementById(`vaga-input-${semanaStr}`);
        const vagas = parseInt(input.value);
        if (!vagas || vagas < 1) return;

        try {
            const res = await fetch(`${API_URL}/api/gestao/capacidade/`, {
                method: 'POST',
                headers: {"X-Gestao-Token": GESTAO_TOKEN, "Content-Type": "application/json"},
                body: JSON.stringify({semana: semanaStr, vagas_total: vagas})
            });
            if (res.ok) {
                carregarVagas();
            }
        } catch {}
    }

    // ── SMS Broadcast ─────────────────────────────────────────────────────
    document.getElementById('smsMensagem')?.addEventListener('input', function () {
        document.getElementById('smsContador').textContent = `${this.value.length} caracteres`;
    });

    async function enviarSms() {
        const mensagem = document.getElementById('smsMensagem').value.trim();
        const resultado = document.getElementById('smsResultado');
        resultado.style.display = 'none';

        if (!mensagem) {
            resultado.textContent = 'Escreve uma mensagem antes de enviar.';
            resultado.style.color = '#ff6b6b';
            resultado.style.display = 'block';
            return;
        }

        if (!confirm(`Enviar este SMS a todos os clientes registados?\n\n"${mensagem}"`)) return;

        try {
            const res = await fetch(`${API_URL}/api/gestao/sms-broadcast/`, {
                method: 'POST',
                headers: {'X-Gestao-Token': GESTAO_TOKEN, 'Content-Type': 'application/json'},
                body: JSON.stringify({mensagem}),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Erro');
            resultado.textContent = `SMS enviado com sucesso: ${data.enviados} entregues, ${data.erros} erros.`;
            resultado.style.color = data.erros > 0 ? '#f0a030' : '#6dbe6d';
        } catch (e) {
            resultado.textContent = `Erro: ${e.message}`;
            resultado.style.color = '#ff6b6b';
        }
        resultado.style.display = 'block';
    }

    // ── Carregar marcações ────────────────────────────────────────────────
    async function carregar() {
        const grid = document.getElementById('bookingsGrid');
        grid.innerHTML = '<div class="empty-state"><p style="color:#555">A carregar...</p></div>';
        try {
            const res = await fetch(`${API_URL}/api/gestao/bookings/`, {
                headers: {"X-Gestao-Token": GESTAO_TOKEN}
            });
            if (!res.ok) {
                grid.innerHTML = `<div class="empty-state"><p style="color:#ff6b6b">Erro ${res.status} — token inválido ou servidor indisponível.</p></div>`;
                return;
            }
            const data = await res.json();
            allBookings = Array.isArray(data) ? data : [];
            renderBookings();
        } catch (e) {
            grid.innerHTML = '<div class="empty-state"><p style="color:#ff6b6b">Erro de ligação ao servidor.</p></div>';
            console.error('Erro ao carregar:', e);
        }
    }

    // ── Sincronizar silencioso (ao carregar a página) ─────────────────────
    async function sincronizarESilencioso() {
        try {
            await fetch(`${API_URL}/api/gestao/sync-calendar/`, {
                method: 'POST',
                headers: {"X-Gestao-Token": GESTAO_TOKEN}
            });
        } catch { /* ignora erros silenciosos */ }
    }

    // ── Sincronizar Calendar → DB ─────────────────────────────────────────
    async function sincronizar() {
        const btn = document.getElementById('syncBtn');
        btn.textContent = 'A sincronizar...';
        btn.disabled = true;
        try {
            const res = await fetch(`${API_URL}/api/gestao/sync-calendar/`, {
                method: 'POST',
                headers: {"X-Gestao-Token": GESTAO_TOKEN}
            });
            const data = await res.json();
            btn.textContent = `✓ ${data.eliminadas} eliminada(s)`;
            setTimeout(() => {
                btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Sync Calendar';
                btn.disabled = false;
            }, 3000);
            carregar();
        } catch {
            btn.textContent = 'Erro';
            btn.disabled = false;
        }
    }

    // ── Filtrar ───────────────────────────────────────────────────────────
    function filtrar(btn) {
        document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filtroAtivo = btn.dataset.estado;
        renderBookings();
    }

    // ── Render ────────────────────────────────────────────────────────────
    function renderBookings() {
        const grid = document.getElementById('bookingsGrid');
        grid.innerHTML = '';

        const lista = filtroAtivo === 'todos'
            ? allBookings
            : allBookings.filter(b => b.estado === filtroAtivo);

        if (lista.length === 0) {
            grid.innerHTML = '<div class="empty-state"><p>Sem marcações neste estado.</p></div>';
            return;
        }

        lista.forEach(b => {
            const options = ESTADOS.map(e =>
                `<option value="${e.key}" ${e.key === b.estado ? 'selected' : ''}>${e.label}</option>`
            ).join('');

            const data = new Date(b.data).toLocaleDateString('pt-PT', {
                day: '2-digit',
                month: 'short',
                year: 'numeric'
            });

            // parsear mensagem: formato "[Serviço — Bicicleta] texto"
            const msgRaw = b.mensagem || '';
            const match = msgRaw.match(/^\[([^\]]+)\]\s*([\s\S]*)$/);
            let servico = '', bicicleta = '', textoMsg = msgRaw;
            if (match) {
                const partes = match[1].split(' — ');
                servico   = partes[0] || '';
                bicicleta = partes[1] || '';
                textoMsg  = match[2].trim();
            }

            grid.innerHTML += `
        <div class="booking-row" id="row-${b.id}" style="grid-template-columns:130px 1fr 120px 200px 32px;align-items:start">
          <div>
            <div class="booking-pedido">${b.numero_pedido}</div>
            <div style="font-size:12px;color:#555;margin-top:4px">${data}</div>
          </div>
          <div>
            <div class="booking-nome">${b.nome}</div>
            <div class="booking-email">${b.email}</div>
            ${servico ? `<div style="font-size:12px;color:#0077cc;margin-top:3px">${servico}</div>` : ''}
          </div>
          <div style="font-size:13px;color:#777">${b.estado_label}</div>
          <div>
            <select class="estado-select" id="select-${b.id}" onchange="mostrarGuardar(${b.id})">
              ${options}
            </select>
            <button class="save-btn" id="save-${b.id}" onclick="guardarEstado(${b.id})">
              Guardar alteração
            </button>
            <button class="save-btn visible" id="del-${b.id}" onclick="eliminar(${b.id})"
              style="background:#2a0a0a;color:#ff6b6b;border-color:#5a1a1a;margin-top:4px">
              <i class="bi bi-trash"></i> Eliminar
            </button>
          </div>
          <div style="padding-top:2px">
            <button class="expand-btn" id="exp-${b.id}" onclick="toggleDetalhe(${b.id})" title="Ver detalhes">›</button>
          </div>
          <div class="booking-detail" id="det-${b.id}">
            ${bicicleta ? `<div class="detail-item"><span class="detail-label">Bicicleta</span><span class="detail-value">${bicicleta}</span></div>` : ''}
            ${servico   ? `<div class="detail-item"><span class="detail-label">Serviço</span><span class="detail-value">${servico}</span></div>` : ''}
            <div class="detail-item"><span class="detail-label">Mensagem do cliente</span><span class="detail-value">${textoMsg || '—'}</span></div>
            <div class="detail-item"><span class="detail-label">Email</span><span class="detail-value">${b.email}</span></div>
            <button class="diag-btn" onclick="abrirModal(${b.id})">
              <i class="bi bi-clipboard2-pulse"></i> Enviar Diagnóstico
            </button>
          </div>
        </div>`;
        });
    }

    // ── Modal Diagnóstico ─────────────────────────────────────────────────
    let modalBookingId = null;

    function abrirModal(id) {
        modalBookingId = id;
        const b = allBookings.find(b => b.id === id);
        if (!b) return;

        const msgRaw = b.mensagem || '';
        const match = msgRaw.match(/^\[([^\]]+)\]\s*([\s\S]*)$/);
        const servico = match ? (match[1].split(' — ')[0] || '') : '';

        document.getElementById('modalSub').textContent = `${b.nome} · ${b.email}`;
        document.getElementById('modalNotas').value = '';
        document.getElementById('modalPreco').value = '';
        document.getElementById('modalPrazo').value = '';
        document.getElementById('modalOverlay').classList.add('open');
    }

    function fecharModal() {
        document.getElementById('modalOverlay').classList.remove('open');
        modalBookingId = null;
    }

    document.getElementById('modalOverlay').addEventListener('click', e => {
        if (e.target === document.getElementById('modalOverlay')) fecharModal();
    });

    function abrirGmail() {
        const b = allBookings.find(b => b.id === modalBookingId);
        if (!b) return;

        const notas = document.getElementById('modalNotas').value.trim() || '—';
        const preco = document.getElementById('modalPreco').value.trim();
        const prazo = document.getElementById('modalPrazo').value.trim() || '—';

        const msgRaw = b.mensagem || '';
        const match = msgRaw.match(/^\[([^\]]+)\]\s*([\s\S]*)$/);
        const servico = match ? (match[1].split(' — ')[0] || '') : 'Serviço de bicicleta';

        const dataFmt = new Date(b.data).toLocaleDateString('pt-PT', {
            day: '2-digit', month: '2-digit', year: 'numeric'
        });

        const corpo = `Olá ${b.nome},

Após recebermos a sua bicicleta e realizarmos o diagnóstico, apresentamos abaixo o resumo da avaliação:

Serviço solicitado: ${servico}
Data da marcação: ${dataFmt}

--- DIAGNÓSTICO ---
${notas}

Estimativa de preço: ${preco ? preco + ' €' : 'A definir'}
Prazo de entrega estimado: ${prazo} dias úteis.

Aguardamos a sua confirmação para prosseguir com a reparação.

Com os melhores cumprimentos,
ATXcyclingstore`;

        const assunto = encodeURIComponent('Diagnóstico da sua bicicleta - ATXcyclingstore');
        const corpoEnc = encodeURIComponent(corpo);
        const mailto = `mailto:${encodeURIComponent(b.email)}?subject=${assunto}&body=${corpoEnc}`;

        window.location.href = mailto;
    }

    function toggleDetalhe(id) {
        const det = document.getElementById(`det-${id}`);
        const btn = document.getElementById(`exp-${id}`);
        det.classList.toggle('open');
        btn.classList.toggle('open');
    }

    function mostrarGuardar(id) {
        document.getElementById(`save-${id}`).classList.add('visible');
    }

    async function eliminar(id) {
        if (!confirm('Tens a certeza que queres eliminar esta marcação?')) return;
        const btn = document.getElementById(`del-${id}`);
        btn.textContent = 'A eliminar...';
        btn.disabled = true;
        try {
            const res = await fetch(`${API_URL}/api/gestao/bookings/${id}/delete/`, {
                method: 'DELETE',
                headers: {"X-Gestao-Token": GESTAO_TOKEN}
            });
            if (res.ok) {
                document.getElementById(`row-${id}`).remove();
                allBookings = allBookings.filter(b => b.id !== id);
            } else {
                btn.textContent = 'Erro';
                btn.disabled = false;
            }
        } catch {
            btn.textContent = 'Erro';
            btn.disabled = false;
        }
    }

    async function guardarEstado(id) {
        const novoEstado = document.getElementById(`select-${id}`).value;
        const btn = document.getElementById(`save-${id}`);

        btn.textContent = 'A guardar...';

        try {
            const res = await fetch(`${API_URL}/api/gestao/bookings/${id}/estado/`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Gestao-Token': GESTAO_TOKEN,
                },
                body: JSON.stringify({estado: novoEstado}),
            });

            if (res.ok) {
                // atualizar localmente
                const idx = allBookings.findIndex(b => b.id === id);
                if (idx !== -1) {
                    allBookings[idx].estado = novoEstado;
                    allBookings[idx].estado_label = ESTADOS.find(e => e.key === novoEstado)?.label || novoEstado;
                }
                btn.textContent = '✓ Guardado';
                btn.style.color = '#30d060';
                setTimeout(() => {
                    btn.classList.remove('visible');
                    btn.textContent = 'Guardar alteração';
                    btn.style.color = '';
                }, 2000);
            } else {
                btn.textContent = 'Erro — tenta novamente';
            }
        } catch {
            btn.textContent = 'Erro de ligação';
        }
    }
</script>

</body>
</html>
