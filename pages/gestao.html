<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão | ATXcyclingstore</title>
    <link rel="icon" type="image/png" href="../favicon_black.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
        }

        /* LOGIN */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 36px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .login-card h1 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .login-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .login-card input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px 16px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            margin-bottom: 14px;
        }

        .login-card input:focus {
            outline: none;
            border-color: #0077cc;
        }

        .login-card button {
            width: 100%;
            background: #0077cc;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            cursor: pointer;
            font-size: 15px;
        }

        .login-card button:hover {
            background: #005fa3;
        }

        .login-error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 10px;
        }

        /* DASHBOARD */
        .dashboard {
            display: none;
        }

        .dashboard.visible {
            display: block;
        }

        .dash-header {
            background: #000;
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .dash-header h1 {
            font-size: 18px;
        }

        .dash-header button {
            background: none;
            border: 1px solid #333;
            color: #aaa;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
        }

        .dash-body {
            padding: 28px;
            max-width: 1100px;
            margin: auto;
        }

        /* abas */
        .abas {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            border-bottom: 1px solid #1e1e1e;
            padding-bottom: 0;
        }

        .aba-btn {
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: #666;
            padding: 10px 18px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: -1px;
            transition: color 0.2s, border-color 0.2s;
        }

        .aba-btn:hover { color: #aaa; }

        .aba-btn.active {
            color: white;
            border-bottom-color: #0077cc;
        }

        .aba-content { display: none; }
        .aba-content.active { display: block; }

        /* filtros */
        .filtros {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filtro-btn {
            padding: 7px 16px;
            border-radius: 20px;
            border: 1px solid #333;
            background: none;
            color: #888;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            transition: 0.2s;
        }

        .filtro-btn:hover {
            border-color: #0077cc;
            color: #0077cc;
        }

        .filtro-btn.active {
            background: #0077cc;
            border-color: #0077cc;
            color: white;
        }

        /* tabela */
        .bookings-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .booking-row {
            background: #111;
            border: 1px solid #1e1e1e;
            border-radius: 10px;
            padding: 18px 22px;
            display: grid;
            grid-template-columns: 130px 1fr 120px 200px;
            gap: 16px;
            align-items: center;
            transition: border-color 0.2s;
        }

        .booking-row:hover {
            border-color: #333;
        }

        .booking-pedido {
            font-size: 13px;
            color: #0077cc;
            font-weight: 600;
        }

        .booking-nome {
            font-size: 15px;
            font-weight: 500;
        }

        .booking-email {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        .booking-data {
            font-size: 13px;
            color: #888;
        }

        /* select de estado */
        .estado-select {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 7px 10px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
        }

        .estado-select:focus {
            outline: none;
            border-color: #0077cc;
        }

        .save-btn {
            margin-top: 8px;
            width: 100%;
            background: #0a2a0a;
            color: #30d060;
            border: 1px solid #1a5a1a;
            border-radius: 6px;
            padding: 6px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            transition: 0.2s;
            display: none;
        }

        .save-btn.visible {
            display: block;
        }

        .save-btn:hover {
            background: #1a4a1a;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #555;
        }

        .expand-btn {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 18px;
            padding: 0 6px;
            transition: color 0.2s, transform 0.2s;
            line-height: 1;
        }

        .expand-btn:hover { color: #aaa; }
        .expand-btn.open { transform: rotate(90deg); color: #0077cc; }

        .booking-detail {
            display: none;
            grid-column: 1 / -1;
            background: #0d0d0d;
            border-top: 1px solid #1e1e1e;
            border-radius: 0 0 10px 10px;
            padding: 16px 22px;
            margin: 0 -22px -18px;
            gap: 12px;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }

        .booking-detail.open { display: grid; }

        .detail-item { display: flex; flex-direction: column; gap: 4px; }
        .detail-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-value { font-size: 14px; color: #ccc; }

        .diag-btn {
            margin-top: 12px;
            grid-column: 1 / -1;
            background: #001a33;
            color: #4da6ff;
            border: 1px solid #004080;
            border-radius: 6px;
            padding: 8px 14px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            width: fit-content;
        }

        .diag-btn:hover { background: #002a4d; }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: #111;
            border: 1px solid #222;
            border-radius: 14px;
            padding: 28px;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 {
            font-size: 17px;
            margin-bottom: 4px;
        }

        .modal-sub {
            font-size: 13px;
            color: #666;
            margin-bottom: 24px;
        }

        .modal-field {
            margin-bottom: 16px;
        }

        .modal-field label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .modal-field input,
        .modal-field textarea {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px 14px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            resize: vertical;
        }

        .modal-field input:focus,
        .modal-field textarea:focus {
            outline: none;
            border-color: #0077cc;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .modal-gmail-btn {
            flex: 1;
            background: #0077cc;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 11px 16px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        .modal-gmail-btn:hover { background: #005fa3; }

        .modal-cancel-btn {
            background: none;
            border: 1px solid #333;
            color: #888;
            border-radius: 6px;
            padding: 11px 16px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: 0.2s;
        }

        .modal-cancel-btn:hover { border-color: #555; color: #aaa; }

        /* GESTÃO DE VAGAS */
        .vagas-section {
            margin-bottom: 32px;
        }

        .vagas-section h2 {
            font-size: 15px;
            color: #aaa;
            margin-bottom: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .vagas-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .vaga-row {
            background: #111;
            border: 1px solid #1e1e1e;
            border-radius: 8px;
            padding: 14px 18px;
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 12px;
            align-items: center;
        }

        .vaga-semana {
            font-size: 14px;
            font-weight: 500;
        }

        .vaga-badge {
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .vaga-badge.ok    { background: #002a10; color: #30d060; border: 1px solid #006030; }
        .vaga-badge.aviso { background: #2a1e00; color: #f0c040; border: 1px solid #6e5000; }
        .vaga-badge.cheio { background: #2a0a0a; color: #ff6b6b; border: 1px solid #5a1a1a; }

        .vaga-input {
            width: 70px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 6px 10px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            text-align: center;
        }

        .vaga-input:focus { outline: none; border-color: #0077cc; }

        .vaga-save-btn {
            background: #0a2a0a;
            color: #30d060;
            border: 1px solid #1a5a1a;
            border-radius: 6px;
            padding: 6px 14px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            transition: 0.2s;
            white-space: nowrap;
        }

        .vaga-save-btn:hover { background: #1a4a1a; }

        /* BOTÃO NOVA MARCAÇÃO */
        .btn-nova-m {
            background: #0077cc;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 22px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        .btn-nova-m:hover { background: #005fa3; }

        /* STEPS NO MODAL NOVA MARCAÇÃO */
        .nm-steps { display: flex; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
        .nm-step {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: #666; opacity: 0.5; transition: 0.2s;
        }
        .nm-step span {
            width: 24px; height: 24px; border-radius: 50%;
            border: 1px solid #444; display: flex; align-items: center;
            justify-content: center; font-size: 12px; flex-shrink: 0;
        }
        .nm-step.active { color: white; opacity: 1; }
        .nm-step.active span { background: #0077cc; border-color: #0077cc; }
        .nm-step.done { opacity: 1; color: #aaa; }
        .nm-step.done span { background: #0077cc; border-color: #0077cc; color: white; }

        .nm-form-step { display: none; }
        .nm-form-step.active { display: block; }

        /* SELETOR DE DIAS */
        .nm-semana-card {
            background: #1a1a1a; border: 1px solid #2a2a2a;
            border-radius: 10px; padding: 14px 16px; margin-top: 8px;
        }
        .nm-semana-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .nm-nav-btn {
            background: #222; border: 1px solid #333; color: #aaa;
            width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
            font-size: 16px; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: 0.15s; font-family: 'Poppins', sans-serif;
        }
        .nm-nav-btn:hover:not(:disabled) { border-color: #0077cc; color: white; }
        .nm-nav-btn:disabled { opacity: 0.3; cursor: default; }
        .nm-semana-vagas {
            font-size: 12px; padding: 3px 10px; border-radius: 12px;
            background: #1a2a1a; color: #6dbe6d; border: 1px solid #2e5e2e;
        }
        .nm-semana-vagas.poucas { background: #2a1a00; color: #f0a030; border-color: #6e4a00; }
        .nm-semana-vagas.cheia  { background: #1a0a0a; color: #ff6b6b; border-color: #5a1a1a; }
        .nm-dias-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .nm-dia-chip {
            padding: 8px 14px; border: 1px solid #333; border-radius: 8px;
            background: #222; color: #ccc; font-family: 'Poppins', sans-serif;
            font-size: 13px; cursor: pointer; transition: 0.15s; white-space: nowrap;
        }
        .nm-dia-chip:hover { border-color: #0077cc; color: white; }
        .nm-dia-chip.ativo { border-color: #0077cc; background: #0a1a2a; color: white; }
        .nm-aviso-entrega {
            font-size: 13px; color: #4da6ff; margin-top: 12px;
            padding: 10px 14px; background: #071828;
            border-left: 3px solid #0077cc; border-radius: 4px;
        }

        /* RESUMO */
        .nm-resumo {
            background: #1a1a1a; border: 1px solid #2a2a2a;
            border-radius: 8px; padding: 18px 20px;
        }
        .nm-resumo p { margin-bottom: 10px; font-size: 14px; color: #ccc; }
        .nm-resumo p:last-child { margin-bottom: 0; }
        .nm-resumo strong { color: #777; font-weight: 500; }

        @media (max-width: 600px) {
            .vaga-row {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto;
            }
            .vaga-badge { grid-column: 2; justify-self: end; }
            .vaga-input { width: 60px; }
        }

        @media (max-width: 700px) {
            .dash-header {
                padding: 12px 16px;
                flex-wrap: wrap;
                gap: 10px;
            }

            .dash-header h1 {
                font-size: 15px;
            }

            .dash-header button {
                padding: 5px 10px;
                font-size: 12px;
            }

            .dash-body {
                padding: 16px;
            }

            .filtros {
                gap: 6px;
            }

            .filtro-btn {
                padding: 5px 12px;
                font-size: 12px;
            }

            .booking-row {
                grid-template-columns: 1fr auto !important;
                grid-template-rows: auto auto auto;
            }

            .booking-row > div:nth-child(1) { grid-column: 1; }
            .booking-row > div:nth-child(2) { grid-column: 1; }
            .booking-row > div:nth-child(3) { grid-column: 1; font-size: 12px; }
            .booking-row > div:nth-child(4) { grid-column: 1 / -1; }
            .booking-row > div:nth-child(5) {
                grid-column: 2;
                grid-row: 1;
                align-self: start;
            }

            .booking-detail {
                grid-template-columns: 1fr;
                margin: 0 -16px -16px;
                padding: 12px 16px;
            }
        }
    </style>
</head>

<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
    <div class="login-card">
        <h1>ATXcyclingstore</h1>
        <p>Área de gestão interna</p>
        <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
        <button onclick="login()">Entrar</button>
        <p class="login-error" id="loginError" style="display:none">Password incorreta.</p>
    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

    <div class="dash-header">
        <h1>Gestão de Marcações</h1>
        <div style="display:flex;gap:10px;align-items:center">
            <button onclick="sincronizar()" id="syncBtn" title="Sincronizar com Google Calendar">
                <i class="bi bi-arrow-repeat"></i> Sync Calendar
            </button>
            <button onclick="carregar()" title="Recarregar lista">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
            <button onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</button>
        </div>
    </div>

    <div class="dash-body">

        <div class="abas">
            <button class="aba-btn active" onclick="mudarAba('marcacoes', this)">Marcações</button>
            <button class="aba-btn" onclick="mudarAba('vagas', this)">Gestão de Vagas</button>
            <button class="aba-btn" onclick="mudarAba('comunicacoes', this)">Comunicações</button>
        </div>

        <div class="aba-content active" id="aba-marcacoes">
            <div style="display:flex;justify-content:flex-end">
                <button class="btn-nova-m" onclick="abrirModalNovaM()">
                    <i class="bi bi-plus-lg"></i> Nova Marcação
                </button>
            </div>
            <div class="filtros" id="filtros">
                <button class="filtro-btn active" data-estado="todos" onclick="filtrar(this)">Todos</button>
                <button class="filtro-btn" data-estado="marcada" onclick="filtrar(this)">Marcação Efetuada</button>
                <button class="filtro-btn" data-estado="recebida" onclick="filtrar(this)">Recebida</button>
                <button class="filtro-btn" data-estado="diagnostico" onclick="filtrar(this)">Em Diagnóstico</button>
                <button class="filtro-btn" data-estado="reparacao" onclick="filtrar(this)">Em Reparação</button>
                <button class="filtro-btn" data-estado="pronta" onclick="filtrar(this)">Pronta</button>
                <button class="filtro-btn" data-estado="entregue" onclick="filtrar(this)">Entregue</button>
            </div>
            <div class="bookings-grid" id="bookingsGrid"></div>
        </div>

        <div class="aba-content" id="aba-vagas">
            <div class="vagas-grid" id="vagasGrid"></div>
        </div>

        <div class="aba-content" id="aba-comunicacoes">
            <div style="max-width:560px">
                <p style="color:#888;font-size:14px;margin-bottom:20px">
                    Envia uma mensagem SMS a todos os clientes registados que aceitaram receber comunicações.
                </p>
                <div style="margin-bottom:14px">
                    <label style="display:block;font-size:13px;color:#aaa;margin-bottom:6px">Mensagem</label>
                    <textarea id="smsMensagem" rows="5" placeholder="Ex: A ATXcyclingstore estará encerrada de 1 a 15 de agosto. Boas férias!"
                        style="width:100%;background:#0a0a0a;border:1px solid #333;border-radius:8px;padding:12px 14px;color:white;font-family:'Poppins',sans-serif;font-size:14px;resize:vertical;box-sizing:border-box;"></textarea>
                    <p id="smsContador" style="font-size:12px;color:#666;margin-top:4px;text-align:right">0 caracteres</p>
                </div>
                <button onclick="enviarSms()" style="background:#0077cc;color:white;border:none;border-radius:8px;padding:12px 24px;font-family:'Poppins',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:background 0.2s;"
                    onmouseover="this.style.background='#005fa3'" onmouseout="this.style.background='#0077cc'">
                    Enviar SMS a todos
                </button>
                <p id="smsResultado" style="margin-top:14px;font-size:14px;display:none"></p>
            </div>
        </div>

    </div>
</div>

<!-- MODAL DIAGNÓSTICO -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2><i class="bi bi-clipboard2-pulse"></i> Enviar Diagnóstico</h2>
        <p class="modal-sub" id="modalSub"></p>

        <div class="modal-field">
            <label>Notas do diagnóstico / peças estimadas</label>
            <textarea id="modalNotas" rows="5" placeholder="Ex: Corrente desgastada, pastilhas de travão a substituir, ajuste de mudanças..."></textarea>
        </div>
        <div class="modal-field">
            <label>Estimativa de preço (€)</label>
            <input type="number" id="modalPreco" placeholder="Ex: 45" min="0">
        </div>
        <div class="modal-field">
            <label>Prazo de entrega estimado</label>
            <input type="text" id="modalPrazo" placeholder="Ex: 3-5 dias úteis">
        </div>

        <div class="modal-actions">
            <button class="modal-gmail-btn" onclick="abrirGmail()">
                <i class="bi bi-envelope"></i> Abrir no Gmail
            </button>
            <button class="modal-cancel-btn" onclick="fecharModal()">Cancelar</button>
        </div>
    </div>
</div>

<!-- MODAL NOVA MARCAÇÃO -->
<div class="modal-overlay" id="modalNovaMOverlay">
    <div class="modal" style="max-width:580px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
            <h2 style="margin:0">Nova Marcação</h2>
            <button onclick="fecharModalNovaM()" style="background:none;border:none;color:#666;font-size:22px;cursor:pointer;line-height:1;padding:4px 8px;border-radius:6px;transition:color 0.2s" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#666'">✕</button>
        </div>

        <!-- Steps -->
        <div class="nm-steps">
            <div class="nm-step active" id="nmStep1"><span>1</span> Serviço</div>
            <div class="nm-step" id="nmStep2"><span>2</span> Dados</div>
            <div class="nm-step" id="nmStep3"><span>3</span> Confirmação</div>
        </div>

        <!-- Passo 1: Serviço -->
        <div class="nm-form-step active" id="nmFormStep1">
            <div class="modal-field">
                <label>Tipo de serviço</label>
                <select id="nmServico" style="width:100%;background:#1a1a1a;border:1px solid #333;border-radius:6px;padding:10px 14px;color:white;font-family:'Poppins',sans-serif;font-size:14px;appearance:none;-webkit-appearance:none;cursor:pointer">
                    <option>Revisão Simples</option>
                    <option>Revisão Básica</option>
                    <option>Revisão Completa BTT (rígida)</option>
                    <option>Revisão Completa BTT (suspensão total)</option>
                    <option>Revisão Completa Estrada</option>
                    <option>Revisão Completa E-Bike</option>
                    <option>Suspensão</option>
                    <option>Outro serviço</option>
                </select>
            </div>
            <div class="modal-field">
                <label>Modelo da bicicleta *</label>
                <input type="text" id="nmModeloBike" placeholder="Marca e modelo">
            </div>
            <div class="modal-field">
                <label>Dia preferencial *</label>
                <div id="nmSemanasLoader"><p style="color:#666;font-size:13px;margin:8px 0">A carregar disponibilidade...</p></div>
                <div class="nm-semana-card" id="nmSemanaCard" style="display:none">
                    <div class="nm-semana-nav">
                        <button type="button" class="nm-nav-btn" id="nmNavAnterior" onclick="nmNavSemana(-1)">‹</button>
                        <div style="flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px">
                            <span style="font-size:13px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:0.04em" id="nmNavTitulo"></span>
                            <span class="nm-semana-vagas" id="nmNavVagas"></span>
                        </div>
                        <button type="button" class="nm-nav-btn" id="nmNavSeguinte" onclick="nmNavSemana(1)">›</button>
                    </div>
                    <div id="nmSemanaDias"></div>
                </div>
                <div class="nm-aviso-entrega" id="nmAvisoEntrega" style="display:none"></div>
                <input type="hidden" id="nmDataEscolhida">
            </div>
            <div class="modal-field">
                <label>Observações (opcional)</label>
                <textarea id="nmMensagem" rows="3" placeholder="Descreve o problema ou serviço pretendido..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="modal-gmail-btn" onclick="nmNextStep(1)">Seguinte →</button>
                <button class="modal-cancel-btn" onclick="fecharModalNovaM()">Cancelar</button>
            </div>
        </div>

        <!-- Passo 2: Dados -->
        <div class="nm-form-step" id="nmFormStep2">
            <div class="modal-field">
                <label>Nome completo *</label>
                <input type="text" id="nmNome" placeholder="Nome do cliente">
            </div>
            <div class="modal-field">
                <label>Email *</label>
                <input type="email" id="nmEmail" placeholder="email@exemplo.com">
            </div>
            <div class="modal-field">
                <label>Telefone *</label>
                <input type="tel" id="nmTelefone" placeholder="+351 912 345 678">
            </div>
            <div class="modal-actions">
                <button class="modal-gmail-btn" onclick="nmNextStep(2)">Seguinte →</button>
                <button class="modal-cancel-btn" onclick="nmPrevStep(2)">← Voltar</button>
            </div>
        </div>

        <!-- Passo 3: Confirmação -->
        <div class="nm-form-step" id="nmFormStep3">
            <div class="nm-resumo" id="nmResumo"></div>
            <div class="modal-actions" style="margin-top:20px">
                <button class="modal-gmail-btn" id="nmSubmitBtn" onclick="nmSubmeter()">
                    <i class="bi bi-check-lg"></i> Criar Marcação
                </button>
                <button class="modal-cancel-btn" onclick="nmPrevStep(3)">← Voltar</button>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? 'http://localhost:8000'
        : 'https://atxcyclingstore.onrender.com';
    function getGestaoToken() { return sessionStorage.getItem('gestao_token') || ''; }

    const ESTADOS = [
        {key: 'marcada', label: 'Marcação Efetuada'},
        {key: 'recebida', label: 'Recebida'},
        {key: 'diagnostico', label: 'Em Diagnóstico'},
        {key: 'reparacao', label: 'Em Reparação'},
        {key: 'pronta', label: 'Pronta'},
        {key: 'entregue', label: 'Entregue'},
    ];

    let allBookings = [];
    let filtroAtivo = 'todos';

    async function login() {
        const pass = document.getElementById('passwordInput').value;
        const errEl = document.getElementById('loginError');
        errEl.style.display = 'none';
        try {
            const res = await fetch(`${API_URL}/api/gestao/auth/`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password: pass}),
            });
            if (!res.ok) {
                errEl.textContent = res.status === 429 ? 'Demasiadas tentativas. Aguarda 1 minuto.' : 'Password incorreta.';
                errEl.style.display = 'block';
                return;
            }
            const data = await res.json();
            sessionStorage.setItem('gestao_token', data.token);
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').classList.add('visible');
            sincronizarESilencioso().then(() => { carregar(); carregarVagas(); });
        } catch {
            errEl.textContent = 'Erro de ligação ao servidor.';
            errEl.style.display = 'block';
        }
    }

    function logout() {
        sessionStorage.removeItem('gestao_token');
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('dashboard').classList.remove('visible');
        document.getElementById('passwordInput').value = '';
    }

    // Restaurar sessão se o token ainda for válido (tab reaberta na mesma sessão)
    if (getGestaoToken()) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').classList.add('visible');
        sincronizarESilencioso().then(() => { carregar(); carregarVagas(); });
    }

    document.getElementById('passwordInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') login();
    });

    function mudarAba(id, btn) {
        document.querySelectorAll('.aba-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.aba-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`aba-${id}`).classList.add('active');
        if (id === 'vagas') carregarVagas();
    }

    const MESES_PT = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

    function segundaFeira(offset = 0) {
        const hoje = new Date();
        const d = new Date(hoje);
        d.setDate(hoje.getDate() - hoje.getDay() + 1 + offset * 7);
        return d;
    }

    function isoDate(d) {
        return d.toISOString().split('T')[0];
    }

    function labelSemana(segunda) {
        const sexta = new Date(segunda);
        sexta.setDate(segunda.getDate() + 4);
        const sabado = new Date(segunda);
        sabado.setDate(segunda.getDate() + 5);
        return `${segunda.getDate()} ${MESES_PT[segunda.getMonth()]} – ${sabado.getDate()} ${MESES_PT[sabado.getMonth()]}`;
    }

    async function carregarVagas() {
        const grid = document.getElementById('vagasGrid');
        grid.innerHTML = '';

        for (let i = 0; i < 11; i++) {
            const segunda = segundaFeira(i);
            const semanaStr = isoDate(segunda);

            try {
                const res = await fetch(`${API_URL}/api/gestao/capacidade/?semana=${semanaStr}`, {
                    headers: {"X-Gestao-Token": getGestaoToken()}
                });
                const d = await res.json();
                const bloqueada = d.vagas_total === 0;
                const pct = d.vagas_total > 0 ? d.vagas_usadas / d.vagas_total : 1;
                const badgeClass = bloqueada ? 'cheio' : pct >= 1 ? 'cheio' : pct >= 0.8 ? 'aviso' : 'ok';
                const badgeText = bloqueada ? 'Bloqueada' : `${d.vagas_usadas} / ${d.vagas_total} vagas`;
                const labelHtml = bloqueada
                    ? `<div class="vaga-semana" style="text-decoration:line-through;opacity:0.5">${labelSemana(segunda)}</div>`
                    : `<div class="vaga-semana">${labelSemana(segunda)}</div>`;

                grid.innerHTML += `
                <div class="vaga-row">
                    ${labelHtml}
                    <span class="vaga-badge ${badgeClass}">${badgeText}</span>
                    <input class="vaga-input" type="number" min="0" max="99"
                        id="vaga-input-${semanaStr}" value="${d.vagas_total}">
                    <button class="vaga-save-btn" onclick="guardarVagas('${semanaStr}')">${bloqueada ? 'Desbloquear' : 'Guardar'}</button>
                </div>`;
            } catch {
                grid.innerHTML += `<div class="vaga-row"><div class="vaga-semana">${labelSemana(segunda)}</div><span style="color:#555;font-size:13px">Erro ao carregar</span></div>`;
            }
        }
    }

    async function guardarVagas(semanaStr) {
        const input = document.getElementById(`vaga-input-${semanaStr}`);
        const vagas = parseInt(input.value);
        if (isNaN(vagas) || vagas < 0) return;

        try {
            const res = await fetch(`${API_URL}/api/gestao/capacidade/`, {
                method: 'POST',
                headers: {"X-Gestao-Token": getGestaoToken(), "Content-Type": "application/json"},
                body: JSON.stringify({semana: semanaStr, vagas_total: vagas})
            });
            if (res.ok) {
                carregarVagas();
            }
        } catch {}
    }

    document.getElementById('smsMensagem')?.addEventListener('input', function () {
        document.getElementById('smsContador').textContent = `${this.value.length} caracteres`;
    });

    async function enviarSms() {
        const mensagem = document.getElementById('smsMensagem').value.trim();
        const resultado = document.getElementById('smsResultado');
        resultado.style.display = 'none';

        if (!mensagem) {
            resultado.textContent = 'Escreve uma mensagem antes de enviar.';
            resultado.style.color = '#ff6b6b';
            resultado.style.display = 'block';
            return;
        }

        if (!confirm(`Enviar este SMS a todos os clientes registados?\n\n"${mensagem}"`)) return;

        try {
            const res = await fetch(`${API_URL}/api/gestao/sms-broadcast/`, {
                method: 'POST',
                headers: {'X-Gestao-Token': getGestaoToken(), 'Content-Type': 'application/json'},
                body: JSON.stringify({mensagem}),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Erro');
            resultado.textContent = `SMS enviado com sucesso: ${data.enviados} entregues, ${data.erros} erros.`;
            resultado.style.color = data.erros > 0 ? '#f0a030' : '#6dbe6d';
        } catch (e) {
            resultado.textContent = `Erro: ${e.message}`;
            resultado.style.color = '#ff6b6b';
        }
        resultado.style.display = 'block';
    }

    async function carregar() {
        const grid = document.getElementById('bookingsGrid');
        grid.innerHTML = '<div class="empty-state"><p style="color:#555">A carregar...</p></div>';
        try {
            const res = await fetch(`${API_URL}/api/gestao/bookings/`, {
                headers: {"X-Gestao-Token": getGestaoToken()}
            });
            if (res.status === 401) { logout(); return; }
            if (!res.ok) {
                grid.innerHTML = `<div class="empty-state"><p style="color:#ff6b6b">Erro ${res.status} — servidor indisponível.</p></div>`;
                return;
            }
            const data = await res.json();
            allBookings = Array.isArray(data) ? data : [];
            renderBookings();
        } catch (e) {
            grid.innerHTML = '<div class="empty-state"><p style="color:#ff6b6b">Erro de ligação ao servidor.</p></div>';
            console.error('Erro ao carregar:', e);
        }
    }

    async function sincronizarESilencioso() {
        try {
            await fetch(`${API_URL}/api/gestao/sync-calendar/`, {
                method: 'POST',
                headers: {"X-Gestao-Token": getGestaoToken()}
            });
        } catch { /* ignora erros silenciosos */ }
    }

    async function sincronizar() {
        const btn = document.getElementById('syncBtn');
        btn.textContent = 'A sincronizar...';
        btn.disabled = true;
        try {
            const res = await fetch(`${API_URL}/api/gestao/sync-calendar/`, {
                method: 'POST',
                headers: {"X-Gestao-Token": getGestaoToken()}
            });
            const data = await res.json();
            btn.textContent = `✓ ${data.eliminadas} eliminada(s)`;
            setTimeout(() => {
                btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Sync Calendar';
                btn.disabled = false;
            }, 3000);
            carregar();
        } catch {
            btn.textContent = 'Erro';
            btn.disabled = false;
        }
    }

    function filtrar(btn) {
        document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filtroAtivo = btn.dataset.estado;
        renderBookings();
    }

    function renderBookings() {
        const grid = document.getElementById('bookingsGrid');
        grid.innerHTML = '';

        const lista = filtroAtivo === 'todos'
            ? allBookings
            : allBookings.filter(b => b.estado === filtroAtivo);

        if (lista.length === 0) {
            grid.innerHTML = '<div class="empty-state"><p>Sem marcações neste estado.</p></div>';
            return;
        }

        lista.forEach(b => {
            const options = ESTADOS.map(e =>
                `<option value="${e.key}" ${e.key === b.estado ? 'selected' : ''}>${e.label}</option>`
            ).join('');

            const data = new Date(b.data).toLocaleDateString('pt-PT', {
                day: '2-digit',
                month: 'short',
                year: 'numeric'
            });

            // parsear mensagem: formato "[Serviço — Bicicleta] texto"
            const msgRaw = b.mensagem || '';
            const match = msgRaw.match(/^\[([^\]]+)\]\s*([\s\S]*)$/);
            let servico = '', bicicleta = '', textoMsg = msgRaw;
            if (match) {
                const partes = match[1];
                servico   = partes[0] || '';
                bicicleta = partes[1] || '';
                textoMsg  = match[2].trim();
            }

            grid.innerHTML += `
        <div class="booking-row" id="row-${b.id}" style="grid-template-columns:130px 1fr 120px 200px 32px;align-items:start">
          <div>
            <div class="booking-pedido">${b.numero_pedido}</div>
            <div style="font-size:12px;color:#555;margin-top:4px">${data}</div>
          </div>
          <div>
            <div class="booking-nome">${b.nome}</div>
            <div class="booking-email">${b.email}</div>
            ${servico ? `<div style="font-size:12px;color:#0077cc;margin-top:3px">${servico}</div>` : ''}
          </div>
          <div style="font-size:13px;color:#777">${b.estado_label}</div>
          <div>
            <select class="estado-select" id="select-${b.id}" onchange="mostrarGuardar(${b.id})">
              ${options}
            </select>
            <button class="save-btn" id="save-${b.id}" onclick="guardarEstado(${b.id})">
              Guardar alteração
            </button>
            <button class="save-btn visible" id="del-${b.id}" onclick="eliminar(${b.id})"
              style="background:#2a0a0a;color:#ff6b6b;border-color:#5a1a1a;margin-top:4px">
              <i class="bi bi-trash"></i> Eliminar
            </button>
          </div>
          <div style="padding-top:2px">
            <button class="expand-btn" id="exp-${b.id}" onclick="toggleDetalhe(${b.id})" title="Ver detalhes">›</button>
          </div>
          <div class="booking-detail" id="det-${b.id}">
            ${bicicleta ? `<div class="detail-item"><span class="detail-label">Bicicleta</span><span class="detail-value">${bicicleta}</span></div>` : ''}
            ${servico   ? `<div class="detail-item"><span class="detail-label">Serviço</span><span class="detail-value">${servico}</span></div>` : ''}
            <div class="detail-item"><span class="detail-label">Mensagem do cliente</span><span class="detail-value">${textoMsg}</span></div>
            <div class="detail-item"><span class="detail-label">Email</span><span class="detail-value">${b.email}</span></div>
            <button class="diag-btn" onclick="abrirModal(${b.id})">
              <i class="bi bi-clipboard2-pulse"></i> Enviar Diagnóstico
            </button>
          </div>
        </div>`;
        });
    }

    let modalBookingId = null;

    function abrirModal(id) {
        modalBookingId = id;
        const b = allBookings.find(b => b.id === id);
        if (!b) return;

        const msgRaw = b.mensagem || '';
        const match = msgRaw.match(/^\[([^\]]+)\]\s*([\s\S]*)$/);
        const servico = match ? (match[1].split(' — ')[0] || '') : '';

        document.getElementById('modalSub').textContent = `${b.nome} · ${b.email}`;
        document.getElementById('modalNotas').value = '';
        document.getElementById('modalPreco').value = '';
        document.getElementById('modalPrazo').value = '';
        document.getElementById('modalOverlay').classList.add('open');
    }

    function fecharModal() {
        document.getElementById('modalOverlay').classList.remove('open');
        modalBookingId = null;
    }

    document.getElementById('modalOverlay').addEventListener('click', e => {
        if (e.target === document.getElementById('modalOverlay')) fecharModal();
    });

    function abrirGmail() {
        const b = allBookings.find(b => b.id === modalBookingId);
        if (!b) return;

        const notas = document.getElementById('modalNotas').value.trim() || '—';
        const preco = document.getElementById('modalPreco').value.trim();
        const prazo = document.getElementById('modalPrazo').value.trim() || '—';

        const msgRaw = b.mensagem || '';
        const match = msgRaw.match(/^\[([^\]]+)\]\s*([\s\S]*)$/);
        const servico = match ? (match[1].split(' — ')[0] || '') : 'Serviço de bicicleta';

        const dataFmt = new Date(b.data).toLocaleDateString('pt-PT', {
            day: '2-digit', month: '2-digit', year: 'numeric'
        });

        const corpo = `Olá ${b.nome},

Após recebermos a sua bicicleta e realizarmos o diagnóstico, apresentamos abaixo o resumo da avaliação:

Serviço solicitado: ${servico}
Data da marcação: ${dataFmt}

--- DIAGNÓSTICO ---
${notas}

Estimativa de preço: ${preco ? preco + ' €' : 'A definir'}
Prazo de entrega estimado: ${prazo} dias úteis.

Aguardamos a sua confirmação para prosseguir com a reparação.

Com os melhores cumprimentos,
ATXcyclingstore`;

        const assunto = encodeURIComponent('Diagnóstico da sua bicicleta - ATXcyclingstore');
        const corpoEnc = encodeURIComponent(corpo);
        const mailto = `mailto:${encodeURIComponent(b.email)}?subject=${assunto}&body=${corpoEnc}`;

        window.location.href = mailto;
    }

    function toggleDetalhe(id) {
        const det = document.getElementById(`det-${id}`);
        const btn = document.getElementById(`exp-${id}`);
        det.classList.toggle('open');
        btn.classList.toggle('open');
    }

    function mostrarGuardar(id) {
        document.getElementById(`save-${id}`).classList.add('visible');
    }

    async function eliminar(id) {
        if (!confirm('Tens a certeza que queres eliminar esta marcação?')) return;
        const btn = document.getElementById(`del-${id}`);
        btn.textContent = 'A eliminar...';
        btn.disabled = true;
        try {
            const res = await fetch(`${API_URL}/api/gestao/bookings/${id}/delete/`, {
                method: 'DELETE',
                headers: {"X-Gestao-Token": getGestaoToken()}
            });
            if (res.ok) {
                document.getElementById(`row-${id}`).remove();
                allBookings = allBookings.filter(b => b.id !== id);
            } else {
                btn.textContent = 'Erro';
                btn.disabled = false;
            }
        } catch {
            btn.textContent = 'Erro';
            btn.disabled = false;
        }
    }

    async function guardarEstado(id) {
        const novoEstado = document.getElementById(`select-${id}`).value;
        const btn = document.getElementById(`save-${id}`);

        btn.textContent = 'A guardar...';

        try {
            const res = await fetch(`${API_URL}/api/gestao/bookings/${id}/estado/`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Gestao-Token': getGestaoToken(),
                },
                body: JSON.stringify({estado: novoEstado}),
            });

            if (res.ok) {
                // atualizar localmente
                const idx = allBookings.findIndex(b => b.id === id);
                if (idx !== -1) {
                    allBookings[idx].estado = novoEstado;
                    allBookings[idx].estado_label = ESTADOS.find(e => e.key === novoEstado)?.label || novoEstado;
                }
                btn.textContent = '✓ Guardado';
                btn.style.color = '#30d060';
                setTimeout(() => {
                    btn.classList.remove('visible');
                    btn.textContent = 'Guardar alteração';
                    btn.style.color = '';
                }, 2000);
            } else {
                btn.textContent = 'Erro — tenta novamente';
            }
        } catch {
            btn.textContent = 'Erro de ligação';
        }
    }

    const NM_MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    let nmDiaEscolhido = null;
    let nmSemanasLista = [];
    let nmSemanaAtual = 0;

    function abrirModalNovaM() {
        nmDiaEscolhido = null;
        nmSemanasLista = [];
        nmSemanaAtual = 0;
        ['nmModeloBike','nmMensagem','nmNome','nmEmail','nmTelefone','nmDataEscolhida'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.value = '';
        });
        document.getElementById('nmServico').selectedIndex = 0;
        document.getElementById('nmAvisoEntrega').style.display = 'none';
        document.getElementById('nmSemanaCard').style.display = 'none';
        document.getElementById('nmSemanasLoader').style.display = 'block';
        document.getElementById('nmSemanasLoader').innerHTML = '<p style="color:#666;font-size:13px;margin:8px 0">A carregar disponibilidade...</p>';
        const btn = document.getElementById('nmSubmitBtn');
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-check-lg"></i> Criar Marcação'; }
        nmMostrarStep(1);
        document.getElementById('modalNovaMOverlay').classList.add('open');
        nmCarregarDias();
    }

    function fecharModalNovaM() {
        document.getElementById('modalNovaMOverlay').classList.remove('open');
    }

    document.getElementById('modalNovaMOverlay').addEventListener('click', e => {
        if (e.target === document.getElementById('modalNovaMOverlay')) fecharModalNovaM();
    });

    function nmMostrarStep(s) {
        [1,2,3].forEach(i => {
            document.getElementById(`nmFormStep${i}`).classList.toggle('active', i === s);
            const stepEl = document.getElementById(`nmStep${i}`);
            stepEl.classList.remove('active','done');
            if (i === s) stepEl.classList.add('active');
            if (i < s)  stepEl.classList.add('done');
        });
    }

    function nmNextStep(from) {
        if (from === 1) {
            if (!nmDiaEscolhido) { alert('Escolhe um dia antes de continuar.'); return; }
            if (!document.getElementById('nmModeloBike').value.trim()) { alert('Preenche o modelo da bicicleta.'); return; }
            nmMostrarStep(2);
        } else if (from === 2) {
            const nome  = document.getElementById('nmNome').value.trim();
            const email = document.getElementById('nmEmail').value.trim();
            const tel   = document.getElementById('nmTelefone').value.trim();
            if (!nome || !email || !tel) { alert('Preenche todos os campos obrigatórios.'); return; }
            nmPreencherResumo();
            nmMostrarStep(3);
        }
    }

    function nmPrevStep(from) { nmMostrarStep(from - 1); }

    function nmPreencherResumo() {
        const servico = document.getElementById('nmServico').value;
        const bike    = document.getElementById('nmModeloBike').value;
        const msg     = document.getElementById('nmMensagem').value.trim() || '—';
        const nome    = document.getElementById('nmNome').value;
        const email   = document.getElementById('nmEmail').value;
        const tel     = document.getElementById('nmTelefone').value;
        document.getElementById('nmResumo').innerHTML = `
            <p><strong>Serviço:</strong> ${servico}</p>
            <p><strong>Bicicleta:</strong> ${bike}</p>
            <p><strong>Dia:</strong> ${nmDiaEscolhido.label}</p>
            <p><strong>Entrega prevista:</strong> ${nmDiaEscolhido.entrega}</p>
            <p><strong>Observações:</strong> ${msg}</p>
            <hr style="border-color:#2a2a2a;margin:14px 0">
            <p><strong>Nome:</strong> ${nome}</p>
            <p><strong>Email:</strong> ${email}</p>
            <p><strong>Telefone:</strong> ${tel}</p>
        `;
    }

    async function nmSubmeter() {
        const btn = document.getElementById('nmSubmitBtn');
        btn.disabled = true;
        btn.innerHTML = 'A criar...';

        const servico = document.getElementById('nmServico').value;
        const bike    = document.getElementById('nmModeloBike').value.trim();
        const msg     = document.getElementById('nmMensagem').value.trim();
        const suffix  = msg ? ` — ${msg}` : '';

        const dados = {
            nome:      document.getElementById('nmNome').value.trim(),
            email:     document.getElementById('nmEmail').value.trim(),
            telefone:  document.getElementById('nmTelefone').value.trim(),
            mensagem:  `[${servico} — ${bike}]${suffix}`,
            data:      nmDiaEscolhido.data,
        };

        try {
            const res = await fetch(`${API_URL}/api/bookings/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados),
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err?.data?.[0] || err?.detail || 'Erro ao criar marcação.');
            }
            const booking = await res.json();
            fecharModalNovaM();
            carregar();
            alert(`Marcação ${booking.numero_pedido} criada!\nEmail de confirmação enviado para ${dados.email}.`);
        } catch (e) {
            alert(e.message);
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-check-lg"></i> Criar Marcação';
        }
    }

    async function nmCarregarDias() {
        try {
            const res = await fetch(`${API_URL}/api/available-days/`);
            if (!res.ok) throw new Error();
            const data = await res.json();
            nmRenderDias(data);
        } catch {
            document.getElementById('nmSemanasLoader').innerHTML =
                '<p style="color:#ff6b6b;font-size:13px;margin:8px 0">Erro ao carregar dias. ' +
                '<button onclick="nmCarregarDias()" style="background:none;border:1px solid #ff6b6b;color:#ff6b6b;border-radius:4px;padding:2px 8px;cursor:pointer;font-family:inherit;font-size:12px;margin-left:6px">Tentar novamente</button></p>';
        }
    }

    function nmRenderDias(dias) {
        const loader = document.getElementById('nmSemanasLoader');
        if (dias.length === 0) {
            loader.innerHTML = '<p style="color:#666;font-size:13px;margin:8px 0">Sem disponibilidade nas próximas semanas.</p>';
            return;
        }
        loader.style.display = 'none';

        const semanas = new Map();
        dias.forEach(d => {
            const dt = new Date(d.data + 'T12:00:00');
            const dom = dt.getDay();
            const segunda = new Date(dt);
            segunda.setDate(dt.getDate() - (dom === 0 ? 6 : dom - 1));
            const key = segunda.toISOString().split('T')[0];
            if (!semanas.has(key)) semanas.set(key, { dias: [], disponiveis: d.disponiveis, cheia: d.cheia, bloqueada: d.bloqueada });
            semanas.get(key).dias.push(d);
        });

        nmSemanasLista = [...semanas.values()].map(s => {
            const p = new Date(s.dias[0].data + 'T12:00:00');
            const u = new Date(s.dias[s.dias.length - 1].data + 'T12:00:00');
            const titulo = p.getMonth() === u.getMonth()
                ? `${p.getDate()}–${u.getDate()} ${NM_MESES[u.getMonth()]}`
                : `${p.getDate()} ${NM_MESES[p.getMonth()]}–${u.getDate()} ${NM_MESES[u.getMonth()]}`;
            return { ...s, titulo };
        });

        nmSemanaAtual = 0;
        document.getElementById('nmSemanaCard').style.display = 'block';
        nmRenderSemanaAtual();
    }

    function nmRenderSemanaAtual() {
        const s = nmSemanasLista[nmSemanaAtual];
        document.getElementById('nmNavTitulo').textContent = `Semana de ${s.titulo}`;
        const vagasEl = document.getElementById('nmNavVagas');
        if (s.bloqueada) {
            vagasEl.textContent = 'Bloqueada — marcação manual';
            vagasEl.className = 'nm-semana-vagas cheia';
        } else if (s.cheia) {
            vagasEl.textContent = `Cheia — 0 vagas`;
            vagasEl.className = 'nm-semana-vagas cheia';
        } else {
            vagasEl.textContent = `${s.disponiveis} vaga${s.disponiveis !== 1 ? 's' : ''}`;
            vagasEl.className = `nm-semana-vagas${s.disponiveis <= 2 ? ' poucas' : ''}`;
        }
        document.getElementById('nmNavAnterior').disabled = nmSemanaAtual === 0;
        document.getElementById('nmNavSeguinte').disabled = nmSemanaAtual === nmSemanasLista.length - 1;

        const diasDiv = document.getElementById('nmSemanaDias');
        diasDiv.innerHTML = '';

        if (s.bloqueada || s.cheia) {
            const aviso = document.createElement('p');
            aviso.style.cssText = 'color:#f0a500;font-size:12px;margin:0 0 8px 0';
            aviso.textContent = s.bloqueada
                ? 'Semana bloqueada — a marcação será adicionada manualmente fora do limite.'
                : 'Semana cheia — a marcação excede a capacidade definida.';
            diasDiv.appendChild(aviso);
        }

        const chips = document.createElement('div');
        chips.className = 'nm-dias-chips';

        s.dias.forEach(d => {
            const partes = d.label.split(', ');
            const labelCurto = (partes[0] || '') + ' ' + (partes[1] || '').split(' ')[0];
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'nm-dia-chip';
            chip.textContent = labelCurto.trim();
            chip.addEventListener('click', () => nmSelecionarDia(d, chip));
            chips.appendChild(chip);
        });
        diasDiv.appendChild(chips);
    }

    function nmNavSemana(dir) {
        nmSemanaAtual = Math.max(0, Math.min(nmSemanasLista.length - 1, nmSemanaAtual + dir));
        nmDiaEscolhido = null;
        document.getElementById('nmDataEscolhida').value = '';
        document.getElementById('nmAvisoEntrega').style.display = 'none';
        nmRenderSemanaAtual();
    }

    function nmSelecionarDia(dia, chip) {
        nmDiaEscolhido = dia;
        document.getElementById('nmDataEscolhida').value = dia.data;
        document.querySelectorAll('.nm-dia-chip').forEach(el => el.classList.remove('ativo'));
        chip.classList.add('ativo');
        const aviso = document.getElementById('nmAvisoEntrega');
        aviso.textContent = `Entrega prevista: ${dia.entrega}`;
        aviso.style.display = 'block';
    }
</script>

</body>
</html>
