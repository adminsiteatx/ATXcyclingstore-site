<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | ATXcyclingstore</title>
    <link rel="icon" type="image/png" href="../favicon_black.png">
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .auth-section {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }
        .auth-box {
            background: #111;
            border: 1px solid #222;
            border-radius: 14px;
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
        }
        .auth-box h1 { font-size: 26px; margin-bottom: 6px; }
        .auth-box p.sub { color: #888; font-size: 14px; margin-bottom: 28px; }
        .auth-field { margin-bottom: 18px; }
        .auth-field label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
        .auth-field input {
            width: 100%; background: #0a0a0a; border: 1px solid #333;
            border-radius: 8px; padding: 11px 14px; color: white;
            font-family: 'Poppins', sans-serif; font-size: 15px; box-sizing: border-box;
        }
        .auth-field input:focus { outline: none; border-color: #0077cc; }
        .btn-auth {
            width: 100%; background: #0077cc; color: white; border: none;
            border-radius: 8px; padding: 13px; font-family: 'Poppins', sans-serif;
            font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 6px;
            transition: background 0.2s;
        }
        .btn-auth:hover { background: #005fa3; }
        .auth-link { text-align: center; margin-top: 20px; font-size: 14px; color: #888; }
        .auth-link a { color: #0077cc; text-decoration: none; }
        .auth-error { color: #ff6b6b; font-size: 14px; margin-top: 14px; display: none; }
        .auth-error.visible { display: block; }
    </style>
</head>
<body id="servicos">
<header>
    <nav class="navbar">
        <a href="../index.html" class="logo"><img src="../images/atx.png" alt="Logo"></a>
        <ul class="nav-links">
            <li><a href="../index.html" class="nav-link">Início</a></li>
            <li><a href="servicos.html" class="nav-link">Serviços</a></li>
            <li><a href="marcas.html" class="nav-link">Marcas</a></li>
            <li><a href="galeria.html" class="nav-link">Galeria</a></li>
            <li><a href="contactos.html" class="nav-link">Contactos</a></li>
            <li><a href="login.html" class="nav-link" id="navAuthLink">Entrar</a></li>
        </ul>
        <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
    </nav>
</header>

<section class="auth-section">
    <div class="auth-box">
        <h1>Entrar</h1>
        <p class="sub">Acede à tua conta para marcar e acompanhar serviços.</p>

        <div class="auth-field">
            <label>Email</label>
            <input type="email" id="email" autocomplete="email">
        </div>
        <div class="auth-field">
            <label>Password</label>
            <input type="password" id="password" autocomplete="current-password">
        </div>

        <button class="btn-auth" onclick="entrar()">Entrar</button>
        <p class="auth-error" id="authError"></p>

        <p class="auth-link" style="margin-top:10px"><a href="recuperar-password.html">Esqueci-me da password</a></p>
        <p class="auth-link">Não tens conta? <a href="registo.html">Regista-te aqui</a></p>
    </div>
</section>

<footer>
    <p>© ATXcyclingstore</p>
    <p>Projeto demonstrativo. Não é o site oficial da empresa.</p>
    <a href="/pages/privacy.html">Política de Privacidade</a>
</footer>

<script src="../js/script.js"></script>
<script>
    // se já estiver autenticado, redirecionar para minha área
    if (localStorage.getItem('atx_access')) {
        const dest = new URLSearchParams(window.location.search).get('next') || '../index.html';
        window.location.href = dest;
    }

    async function entrar() {
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errEl    = document.getElementById('authError');
        errEl.classList.remove('visible');

        if (!email || !password) {
            errEl.textContent = 'Preenche todos os campos.';
            errEl.classList.add('visible');
            return;
        }

        try {
            const res = await fetch(`${API_URL}/api/auth/login/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Erro');

            localStorage.setItem('atx_access', data.access);
            localStorage.setItem('atx_refresh', data.refresh);
            localStorage.setItem('atx_nome', data.nome);
            localStorage.setItem('atx_email', data.email);

            const dest = new URLSearchParams(window.location.search).get('next') || '../index.html';
            window.location.href = dest;
        } catch (e) {
            errEl.textContent = e.message;
            errEl.classList.add('visible');
        }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
</script>
</body>
</html>
